name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/Remontoire.slnx --configuration Release

      - name: Test
        run: dotnet test src/Remontoire.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Remontoire.slnx --configuration Release --no-build --output src/Samples/LocalPackages

      - name: Build sample against the packages
        run: dotnet build src/Samples/ClusterSample/ClusterSample.csproj --configuration Release
